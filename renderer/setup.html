<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubcore Kiosk — Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #4F46E5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .icon span {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.5;
    }

    input {
      width: 100%;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: #111827;
      background: #F9FAFB;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 8px;
    }

    input:focus {
      border-color: #4F46E5;
    }

    input.error {
      border-color: #EF4444;
    }

    .error-msg {
      color: #EF4444;
      font-size: 13px;
      align-self: flex-start;
      margin-bottom: 8px;
      min-height: 18px;
    }

    button {
      width: 100%;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }

    button:hover { background: #4338CA; }
    button:active { background: #3730A3; }
    button:disabled { background: #A5B4FC; cursor: not-allowed; }

    .version {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><span>C</span></div>
    <h1>Cubcore Kiosk</h1>
    <p class="subtitle">Enter your Warehouse ID to launch the kiosk in fullscreen mode.</p>

    <input
      type="text"
      id="slug"
      placeholder="e.g. flybear"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
    />
    <p class="error-msg" id="error"></p>

    <button id="launch">Launch Kiosk →</button>

    <p class="version" id="version"></p>
  </div>

  <script>
    const slugInput = document.getElementById('slug');
    const errorEl = document.getElementById('error');
    const launchBtn = document.getElementById('launch');
    const versionEl = document.getElementById('version');

    window.kiosk.getVersion().then((v) => {
      versionEl.textContent = `v${v}`;
    });

    slugInput.focus();

    function showError(msg) {
      errorEl.textContent = msg;
      slugInput.classList.add('error');
    }

    function clearError() {
      errorEl.textContent = '';
      slugInput.classList.remove('error');
    }

    slugInput.addEventListener('input', clearError);

    async function launch() {
      const slug = slugInput.value.trim().toLowerCase();
      if (!slug) {
        showError('Please enter your Warehouse ID.');
        return;
      }
      if (!/^[a-z0-9-]+$/.test(slug)) {
        showError('Warehouse ID can only contain letters, numbers, and hyphens.');
        return;
      }
      launchBtn.disabled = true;
      launchBtn.textContent = 'Launching…';
      await window.kiosk.saveSlug(slug);
    }

    launchBtn.addEventListener('click', launch);
    slugInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') launch();
    });
  </script>
</body>
</html>
